<!DOCTYPE html>
<html lang="es">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="../../img/logo/favicon.ico" type="image/x-icon" />
    <link rel="mask-icon" href="../../img/logo/favicon.png" color="#000000" />
    <title>Interior - Construcciones Esgarcas</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        header, footer {
            background-color: #000;
            color: white;
            text-align: center;
            padding: 15px 0;
        }
        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            padding: 15px;
        }
        .logo-container a {
            display: inline-block;
            height: 100px;
            line-height: 0;
        }
        .logo-container a img {
            height: 100%;
            display: block;
        }
        .logo-container h1 {
            font-size: 2rem;
            margin: 0;
        }
        .titulo-principal {
            text-align: center;
            font-size: 2rem;
            margin: 20px 0;
            font-weight: 800;
        }
        section.proyecto {
            max-width: 1200px;
            margin: 40px auto;
            display: flex;
            align-items: center;
            gap: 30px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        section.proyecto:nth-child(even) {
            flex-direction: row-reverse;
        }
        .proyecto-texto {
            flex: 1;
        }
        .proyecto-texto h2 {
            font-weight: 700;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        .proyecto-texto p {
            font-size: 1rem;
            line-height: 1.4;
            color: #555;
        }
        .proyecto-carousel {
            flex: 1;
            position: relative;
            max-width: 500px;
            height: 300px; /* altura fija */
            overflow: hidden;
            /*border-radius: 12px;*/
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            background: #eee;
           /* display: flex;
            align-items: center;
            justify-content: center;*/
        }
        .proyecto-carousel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            cursor: pointer;
            user-select: none;
        }
        .proyecto-carousel .btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0,0,0,0.4);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            z-index: 10;
            border-radius: 50%;
            font-size: 1.5rem;
            user-select: none;
            transition: background-color 0.3s ease;
        }
        .proyecto-carousel .btn:hover {
            background-color: rgba(0,0,0,0.7);
        }
        .proyecto-carousel .btn.left {
            left: 10px;
        }
        .proyecto-carousel .btn.right {
            right: 10px;
        }
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1500;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-carousel {
            position: relative;
            max-width: 80vw;
            max-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #222;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 0 20px black;
        }
        .modal-carousel img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            cursor: default;
            border-radius: 10px;
            user-select: none;
        }
        .modal-carousel .btn {
            background-color: rgba(255,255,255,0.2);
            color: white;
            border-radius: 50%;
            padding: 10px 15px;
            font-size: 2rem;
            user-select: none;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .modal-carousel .btn:hover {
            background-color: rgba(255,255,255,0.5);
        }
        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 2.5rem;
            color: white;
            cursor: pointer;
            user-select: none;
            font-weight: 900;
            transition: color 0.3s ease;
            z-index: 1600;
        }
        .modal-close:hover {
            color: #f00;
        }
        @media (max-width: 768px) {
             section.proyecto {
                    flex-direction: column !important;
                    padding: 15px;
                }
             section.proyecto:nth-child(even) {
                 flex-direction: column !important;
                }
             .proyecto-carousel {
                 max-width: 100%;
                 margin-top: 20px;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="logo-container">
        <a href="../../index.html">
            <img src="../../img/logo/logo.jpg" alt="Logo ESGARCAS" />
        </a>
        <h1>CONSTRUCCIONES ESGARCAS</h1>
    </div>
</header>

<h2 class="titulo-principal">INTERIORES</h2>

<div id="contenedor-proyectos"></div>

<footer>
    Construcciones Esgarcas © 2023
</footer>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal-carousel">
        <button class="btn left" id="modalPrev">&#10094;</button>
        <img src="" alt="Imagen ampliada" id="modalImage" />
        <button class="btn right" id="modalNext">&#10095;</button>
        <span class="modal-close" id="modalClose">&times;</span>
    </div>
</div>

<script>
    // Arreglo con las imágenes de cada proyecto (3 por proyecto)
    const projectImages = [
        [
            "../../img/servicios/interiores/proyecto1/interior_estudio_mara.png",
            "../../img/servicios/interiores/proyecto1/interior_estudio_mara_2.png",
            "../../img/servicios/interiores/proyecto1/interior_estudio_mara_3.png",
            "../../img/servicios/interiores/proyecto1/interior_estudio_mara_4.png",
            "../../img/servicios/interiores/proyecto1/interior_estudio_mara_5.png",
            "../../img/servicios/interiores/proyecto1/interior_estudio_mara_6.png"
        ],
        [
            "../../img/servicios/interiores/proyecto2/interior1.jpg",
            "../../img/servicios/interiores/proyecto3/interior1.jpg",
            "../../img/servicios/interiores/proyecto4/interior1.jpg"
        ],
        [
            "../../img/servicios/interiores/proyecto3/interior1.jpg",
            "../../img/servicios/interiores/proyecto4/interior1.jpg",
            "../../img/servicios/interiores/proyecto5/interior1.jpg"
        ],
        [
            "../../img/servicios/interiores/proyecto4/interior1.jpg",
            "../../img/servicios/interiores/proyecto5/interior1.jpg",
            "../../img/servicios/interiores/proyecto6/interior1.jpg"
        ],
        [
            "../../img/servicios/interiores/proyecto5/interior1.jpg",
            "../../img/servicios/interiores/proyecto6/interior1.jpg",
            "../../img/servicios/interiores/proyecto1/interior1.jpg"
        ],
        [
            "../../img/servicios/interiores/proyecto6/interior1.jpg",
            "../../img/servicios/interiores/proyecto1/interior1.jpg",
            "../../img/servicios/interiores/proyecto1/interior1.jpg"
        ]
    ];
    // Títulos de los proyectos
    const projectTitles = [
        "Estudio en vivienda unifamiliar",
        "Reforma integral de salón",
        "Diseño de oficina moderna",
        "Decoración de loft urbano",
        "Renovación de apartamento clásico",
        "Espacios abiertos con estilo"
    ];
    // Textos de proyectos para descripción
    const projectTexts = [
        "Este proyecto consistió en la transformación integral de un espacio exterior en desuso en un estudio habitable dentro de una vivienda unifamiliar. Se partió de una estructura básica de obra vista, donde se realizaron los siguientes trabajos: demoliciones y saneamiento de muros existentes, ejecución de cerramientos de fábrica de ladrillo cerámico para un óptimo aislamiento, nueva instalación eléctrica y de telecomunicaciones, colocación de carpintería exterior de aluminio con acabado efecto madera, revestimiento exterior con pintura blanca y pavimentación en gres porcelánico de gran formato. El resultado es un estudio funcional, moderno y abierto al exterior, que convierte un espacio desaprovechado en una extensión habitable de la vivienda.",
        "En este proyecto, hemos trabajado en la optimización de espacios interiores para brindar una mayor funcionalidad sin sacrificar el diseño. Cada material ha sido cuidadosamente seleccionado para un acabado impecable.",
        "Esta es una de nuestras destacadas obras de interior, donde la calidad y el diseño se fusionan para ofrecer un espacio elegante y funcional. Nos enfocamos en cada detalle para garantizar un resultado excepcional.",
        "En este proyecto, hemos trabajado en la optimización de espacios interiores para brindar una mayor funcionalidad sin sacrificar el diseño. Cada material ha sido cuidadosamente seleccionado para un acabado impecable.",
        "Esta es una de nuestras destacadas obras de interior, donde la calidad y el diseño se fusionan para ofrecer un espacio elegante y funcional. Nos enfocamos en cada detalle para garantizar un resultado excepcional.",
        "En este proyecto, hemos trabajado en la optimización de espacios interiores para brindar una mayor funcionalidad sin sacrificar el diseño. Cada material ha sido cuidadosamente seleccionado para un acabado impecable."
    ];

    // Contenedor donde insertamos los proyectos
    const contenedorProyectos = document.getElementById('contenedor-proyectos');

    // Crear los proyectos dinámicamente
    projectImages.forEach((images, i) => {
        const section = document.createElement('section');
        section.classList.add('proyecto');
        if ((i+1) % 2 === 0) section.style.flexDirection = 'row-reverse';

        // Crear el HTML interno con el primer imagen del carousel
        section.innerHTML = `
            <div class="proyecto-texto">
                <h2>${projectTitles[i]}</h2>
                <p>${projectTexts[i]}</p>
            </div>
            <div class="proyecto-carousel">
                <button class="btn left">&#10094;</button>
                <img src="${images[0]}" alt="Obra interior proyecto ${i + 1}" />
                <button class="btn right">&#10095;</button>
            </div>
        `;

        // Guardamos las imágenes para ese proyecto en dataset
        section.dataset.images = JSON.stringify(images);

        contenedorProyectos.appendChild(section);
    });

    // Variables modal
    const modalOverlay = document.getElementById('modalOverlay');
    const modalImage = document.getElementById('modalImage');
    const modalPrevBtn = document.getElementById('modalPrev');
    const modalNextBtn = document.getElementById('modalNext');
    const modalCloseBtn = document.getElementById('modalClose');

    let currentProjectImages = [];
    let currentIndex = 0;

    // Inicialización de carousels en cada proyecto
    const proyectos = document.querySelectorAll('section.proyecto');

    proyectos.forEach((proyecto) => {
        const carousel = proyecto.querySelector('.proyecto-carousel');
        const leftBtn = carousel.querySelector('.btn.left');
        const rightBtn = carousel.querySelector('.btn.right');
        const imgElement = carousel.querySelector('img');
        const images = JSON.parse(proyecto.dataset.images);

        let index = 0;

        function updateImage() {
            imgElement.src = images[index];
        }

        leftBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            index = (index - 1 + images.length) % images.length;
            updateImage();
        });

        rightBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            index = (index + 1) % images.length;
            updateImage();
        });

        // Abrir modal al hacer clic en la imagen
        imgElement.addEventListener('click', () => {
            currentProjectImages = images;
            currentIndex = index;
            modalImage.src = currentProjectImages[currentIndex];
            modalOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        });
    });

    // Funciones modal
    function showModalImage(idx) {
        currentIndex = (idx + currentProjectImages.length) % currentProjectImages.length;
        modalImage.src = currentProjectImages[currentIndex];
    }

    modalPrevBtn.addEventListener('click', () => {
        showModalImage(currentIndex - 1);
    });

    modalNextBtn.addEventListener('click', () => {
        showModalImage(currentIndex + 1);
    });

    modalCloseBtn.addEventListener('click', () => {
        modalOverlay.classList.remove('active');
        document.body.style.overflow = '';
    });

    modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === "Escape" && modalOverlay.classList.contains('active')) {
            modalOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }
    });
</script>

</body>
</html>
